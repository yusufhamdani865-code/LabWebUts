
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RuangBaca</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1>RuangBaca</h1>
            <p class="subtitle">Selamat datang di toko buku online kami</p>

            <form id="formLogin">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <div class="login-links">
                <a href="#" id="lupaPassword">Lupa Password?</a>
                <span>Belum punya akun? <a href="#" id="daftarAkun">Daftar</a></span>
            </div>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div id="modalLupa" class="modal">
        <div class="modal-content">
            <span class="close" id="tutupLupa">&times;</span>
            <h2>Lupa Password</h2>
            <p>Silakan hubungi admin untuk bantuan pemulihan akun.</p>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close" id="tutupDaftar">&times;</span>
            <h2>Daftar Akun</h2>
            <p>Fitur pendaftaran akun hanya berupa tampilan pada proyek ini.</p>
        </div>
    </div>

</body>
</html>
