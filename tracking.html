
<!DOCTYPE html>
<html lang="id">
<head>

    <title>Tracking Pesanan - RuangBaca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-tracking">
        <h1>RuangBaca</h1>
        <p>Pelacakan Pesanan Buku</p>
    </header>

    <main class="container-tracking">

        <section class="judul-tracking">
            <h2>Tracking Pesanan</h2>
            <p>Pantau status pesanan buku Anda di sini.</p>
        </section>

       
<section class="pencarian-tracking">
    <h3>Cari Pesanan</h3>

    <form id="formTracking">
        <input
            type="text"
            id="nomorDO"
            placeholder="Masukkan Nomor Delivery Order"
            required
        >

        <button type="submit">Cari</button>
    </form>
</section>

<section id="daftarTracking">
    <!-- Hasil pencarian ditampilkan melalui JavaScript -->
</section>


        <div class="aksi-tracking">
            <a href="checkout.html">Kembali ke Checkout</a>
            <a href="dashboard.html">Kembali ke Dashboard</a>
        </div>

    </main>

    <script src="js/tracking.js" defer></script>

</html>
